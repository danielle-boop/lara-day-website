<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lara Day School Fun Game</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    font-family: "Comic Sans MS", Arial, sans-serif;
    background: linear-gradient(#fce4ec, #e0f7fa);
    text-align: center;
    padding: 20px;
}

h1 {
    color: #ff6b6b;
    margin-bottom: 30px;
}

/* Mini game */
#gameContainer {
    margin-top: 30px;
    background: #fff3bf;
    border-radius: 20px;
    padding: 20px;
    position: relative;
    height: 350px;
    overflow: hidden;
    box-shadow: 0 8px 15px rgba(0,0,0,0.2);
}

#score, #timer {
    font-size: 24px;
    font-weight: bold;
    color: #ff6b6b;
    margin: 10px;
}

.butterfly {
    width: 60px;
    position: absolute;
    cursor: pointer;
    transition: transform 0.2s;
}
</style>
</head>
<body>

<h1>🦋 Catch the Butterfly Game!</h1>
<div id="score">Score: 0</div>
<div id="timer">Time: 0s</div>

<div id="gameContainer">
  <img src="https://i.ibb.co/2n0LQSm/butterfly.png" class="butterfly" id="butterfly1" alt="Butterfly">
  <img src="https://i.ibb.co/2n0LQSm/butterfly.png" class="butterfly" id="butterfly2" alt="Butterfly">
</div>

<script>
const container = document.getElementById('gameContainer');
const scoreDisplay = document.getElementById('score');
const timerDisplay = document.getElementById('timer');
const butterflies = [document.getElementById('butterfly1'), document.getElementById('butterfly2')];
let score = 0;
let timeLeft = 30;

// Function to move butterflies randomly
function moveButterfly(butterfly) {
    const maxX = container.clientWidth - butterfly.clientWidth;
    const maxY = container.clientHeight - butterfly.clientHeight;
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    butterfly.style.left = x + 'px';
    butterfly.style.top = y + 'px';
    butterfly.style.transform = `rotate(${Math.random()*360}deg) scale(1.1)`;
    setTimeout(() => { butterfly.style.transform = `rotate(0deg) scale(1)`; }, 200);
}

// Move butterflies every 1.5 seconds
setInterval(() => butterflies.forEach(moveButterfly), 1500);

// Click to increase score
butterflies.forEach(b => {
    b.addEventListener('click', () => {
        score++;
        scoreDisplay.textContent = "Score: " + score;
        moveButterfly(b);
    });
});

// Timer countdown
const timerInterval = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = `Time: ${timeLeft}s`;
    if(timeLeft <= 0){
        clearInterval(timerInterval);
        alert(`Time's up! Your score: ${score}`);
        location.reload(); // restart game
    }
}, 1000);
</script>

</body>
</html>
